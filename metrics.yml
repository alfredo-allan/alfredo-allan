# Gera métricas detalhadas a partir da atividade real do perfil:
#  - metrics.languages.svg  → linguagens mais usadas nos seus repositórios (% de código)
#  - metrics.activity.svg   → calendário isométrico do ano, hábitos de código e conquistas
#
# PRÉ-REQUISITO: secret METRICS_TOKEN em Settings → Secrets and variables → Actions,
# com um token clássico (scopes: public_repo e read:user).
name: Métricas do perfil

on:
  schedule:
    - cron: "40 3 * * *" # todo dia às 00:40 (horário de Brasília)
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/metrics.yml"]

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: false

jobs:
  languages:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Linguagens mais usadas
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.languages.svg
          base: ""
          config_timezone: America/Sao_Paulo
          config_display: large
          plugin_languages: yes
          plugin_languages_details: percentage, bytes-size
          plugin_languages_limit: 10
          plugin_languages_threshold: 1%
          plugin_languages_sections: most-used, recently-used
          plugin_languages_recent_days: 90
          plugin_languages_colors: github

  activity:
    runs-on: ubuntu-latest
    needs: languages
    timeout-minutes: 30
    steps:
      - name: Calendário, hábitos e conquistas
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.activity.svg
          base: ""
          config_timezone: America/Sao_Paulo
          config_display: large
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 30
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_achievements: yes
          plugin_achievements_display: compact
          plugin_achievements_threshold: C
          plugin_achievements_secrets: yes
