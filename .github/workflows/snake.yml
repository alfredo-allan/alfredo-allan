# Gera a animação da "cobrinha" comendo o gráfico de contribuições.
# Os SVGs são publicados no branch `output` e usados pelo README.
name: Snake de contribuições

on:
  schedule:
    - cron: "0 3 * * *" # todo dia às 00:00 (horário de Brasília)
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/snake.yml"]

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Gerar SVGs da cobrinha
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#2F81F7&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353

      - name: Publicar no branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
